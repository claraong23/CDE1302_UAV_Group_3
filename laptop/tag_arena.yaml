# Arena layout for tag_mission.py
#
# Frame: origin = tag 1 at the pad centre, x = forward towards the search area,
# y = to the right (towards the bottom of the handout drawing). Metres.
# Every tag lies flat on the floor with its printed TOP edge pointing +x;
# if one is turned, give its yaw in degrees (90 = top edge points +y).
#
# The camera looks straight down and sees only about 1.0 m x 0.8 m at 0.5 m
# height, so the route must pass OVER each landmark or it will never be seen.

tag_size_m: 0.12

known_tags:          # id: [x, y, yaw_deg]   <-- MEASURE these with a tape
  1: [0.00,  0.00, 0]     # origin, pad centre
  2: [0.65, -1.35, 0]     # start of the first row
  8: [4.75, -1.35, 0]     # end of the first row
  9: [0.65,  0.90, 0]     # end of the second row

targets: [4, 5, 6, 7]

# Waypoints (x, y) flown after takeoff, in order. The drone lands at the last one.
# U path over the six possible target spots (x = 1.35, 2.70, 4.05 on
# rows y = -1.35 and +0.90), passing over every landmark.
route:
  - [0.65, -1.35]   # over tag 2
  - [1.35, -1.35]
  - [2.70, -1.35]
  - [4.05, -1.35]
  - [4.75, -1.35]   # over tag 8
  - [4.75,  0.90]
  - [4.05,  0.90]
  - [2.70,  0.90]
  - [1.35,  0.90]
  - [0.65,  0.90]   # over tag 9
  - [0.00,  0.00]   # home over tag 1, then land

# ---------------------------------------------------------------------------
# Search behaviour (tag_mission.py --search). Preview without a drone:
#     python laptop/search_patterns.py --plot search_plan.png
#
# Corner names as on the handout drawing (x forward = right, y = down):
#   TL = (x_min, y_min)  TR = (x_max, y_min)  BL = (x_min, y_max)  BR = (x_max, y_max)
# Flight: pad -> entry -> pattern 1 -> DECISION at TL -> (pattern 2 ...) -> exit -> land.
# At the decision: all expected targets found -> exit; otherwise the next pattern.
search:
  area: {x_min: 0.90, x_max: 4.50, y_min: -1.80, y_max: 1.35}   # green search area, as drawn
  # With the camera straight down the drone sees only ~0.45 m to each side, so on the
  # green edges the middle spots are at the edge of the view: red (facing +x) misses
  # (2.70, 0.90), blue (facing -x) misses (2.70, -1.35); together they cover all six.
  # Same shape with the top/bottom lines on the tag rows - every spot seen in red alone:
  # area: {x_min: 0.90, x_max: 4.50, y_min: -1.35, y_max: 0.90}
  entry: [[0.90, 0.00], TL]          # straight forward to the area, then up its left edge
  exit:  [[0.90, 0.00], [0.00, 0.00]] # back down the left edge, home over tag 1, land
  patterns:                          # each starts and ends at the decision corner TL
    - name: red                      # flown first
      corners: [TL, BR, BL, TR, TL]
      heading: 0                     # nose (camera top) faces +x for the whole pattern
    - name: blue                     # "try again": same lines, opposite direction
      corners: [TL, TR, BL, BR, TL]
      heading: 180                   # turns at TL to face -x for the whole pattern
  turn:                              # how the heading is set at TL (trajectory mode)
    tolerance_deg: 10                # accept the heading when this close
    look_m: 0.6                      # CMD_GOTO aim point this far away in the wanted direction
    timeout_s: 8                     # per attempt
    attempts: 3
  expected_tags: 3                   # targets the examiner placed (0 = all ids in `targets`)
  stop_early: true                   # leave as soon as that many targets have been seen
  max_loops: 2                       # patterns flown before giving up (repeats the list)
  mode: trajectory                   # trajectory: smooth, heading held, speeds below
                                     # waypoints:  CMD_GOTO corner to corner, drift-corrected
  speed:                             # trajectory mode only
    cruise: 0.20                     # m/s on straight lines (lab limit 0.30)
    corner: 0.08                     # m/s through corners
    corner_radius: 0.30              # m, how much corners are rounded
    accel: 0.08                      # m/s^2
    smoothing_s: 1.2                 # s, softens every speed change
  goto_speed: 0.10                   # m/s, firmware CMD_GOTO cruise (sets waypoint timeouts)
  spots:                             # possible target positions, for the preview only
    - [1.35, -1.35]
    - [2.70, -1.35]
    - [4.05, -1.35]
    - [1.35,  0.90]
    - [2.70,  0.90]
    - [4.05,  0.90]
  camera: {pitch_deg: 90, altitude: 0.5}   # preview only; match --cam-pitch
