# Arena layout for tag_mission.py
#
# Frame: origin = tag 1 at the pad centre, x = forward towards the search area,
# y = to the right (towards the bottom of the handout drawing). Metres.
# Every tag lies flat on the floor with its printed TOP edge pointing +x;
# if one is turned, give its yaw in degrees (90 = top edge points +y).
#
# The camera looks straight down and sees only about 1.0 m x 0.8 m at 0.5 m
# height, so the route must pass OVER each landmark or it will never be seen.

tag_size_m: 0.12

known_tags:          # id: [x, y, yaw_deg]   <-- MEASURE these with a tape
  1: [0.00,  0.00, 0]     # origin, pad centre
  2: [0.65, -1.35, 0]     # start of the first row
  8: [4.75, -1.35, 0]     # end of the first row
  9: [0.65,  0.90, 0]     # end of the second row

targets: [4, 5, 6, 7]

# Waypoints (x, y) flown after takeoff, in order. The drone lands at the last one.
# U path over the six possible target spots (x = 1.35, 2.70, 4.05 on
# rows y = -1.35 and +0.90), passing over every landmark.
route:
  - [0.65, -1.35]   # over tag 2
  - [1.35, -1.35]
  - [2.70, -1.35]
  - [4.05, -1.35]
  - [4.75, -1.35]   # over tag 8
  - [4.75,  0.90]
  - [4.05,  0.90]
  - [2.70,  0.90]
  - [1.35,  0.90]
  - [0.65,  0.90]   # over tag 9
  - [0.00,  0.00]   # home over tag 1, then land
